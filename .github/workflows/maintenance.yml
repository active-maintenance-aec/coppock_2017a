# Active maintenance check: reruns run_all.R on current R and CRAN packages every
# 8 weeks, in this repository's own slot. The shared logic, and the schedule for
# every repository, live in active-maintenance-aec/maintenance.
name: maintenance

on:
  schedule:
    - cron: "47 6 * * 2"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    uses: active-maintenance-aec/maintenance/.github/workflows/check.yml@main
    with:
      phase: 0
      unjudged: "ground_truth/original_archive_* ground_truth/sampler_comparison.csv maintained/output/figure_1_* maintained/output/table_a1_subgroup_estimates.* maintained/output/text_descriptive_claims.csv"
      verdicts_only: "ground_truth/coppock_2017a_ground_truth.csv"
